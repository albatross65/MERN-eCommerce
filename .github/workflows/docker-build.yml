name: Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t mern-backend -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t mern-frontend ./frontend
